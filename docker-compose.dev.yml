# Symbia Stack - Development Overrides
#
# NOT loaded automatically. Renamed from docker-compose.override.yml on
# 8 Aug 2026 precisely so that it is not: an auto-loading override means the
# exposure surface declared in docker-compose.yml is not the one anybody
# actually gets, and a default that no run uses is a claim rather than a fact.
#
# Use it explicitly:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# or let start.sh set COMPOSE_FILE for you.
#
# What it adds: host-published ports for psql, the nine services and the
# operator console on 8000, plus debug logging and relaxed bootstrap ordering.
#
# Services do not WAIT on db-bootstrap here, which is what makes restarts fast.
# Bootstrap itself still runs.
#
# Defect D10: this file used to replace db-bootstrap entirely with
#   command: ["echo", "Skipping bootstrap - tables already exist"]
# The condition that claim rested on was "bootstrap has run before", not "these
# tables exist". So any table added to any service was silently a no-op on an
# existing dev install, and the service would start healthy and then fail at
# its first query. The runtime's Phase 3 schema had to be applied by hand with
# psql to discover this.
#
# bootstrap.sh is already idempotent — it creates databases only if missing and
# rewrites its DDL to CREATE TABLE / INDEX IF NOT EXISTS — so skipping it bought
# nothing that removing the depends_on conditions below does not already buy.
services:

  # Identity - remove db-bootstrap dependency
  identity:
    ports:
      - "${IDENTITY_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Logging - remove db-bootstrap dependency
  logging:
    ports:
      - "${LOGGING_PORT:-5002}:5002"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Catalog - remove db-bootstrap dependency
  catalog:
    ports:
      - "${CATALOG_PORT:-5003}:5003"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Messaging - remove db-bootstrap dependency
  messaging:
    ports:
      - "${MESSAGING_PORT:-5005}:5005"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Network
  network:
    ports:
      - "${NETWORK_PORT:-5009}:5009"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  directory:
    ports:
      - "${DIRECTORY_PORT:-5010}:5010"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Runtime - remove db-bootstrap dependency
  runtime:
    ports:
      - "${RUNTIME_PORT:-5006}:5006"
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Assistants - remove db-bootstrap dependency
  assistants:
    ports:
      - "${ASSISTANTS_PORT:-5004}:5004"
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Integrations
  integrations:
    ports:
      - "${INTEGRATIONS_PORT:-5007}:5007"
    depends_on:
      identity:
        condition: service_healthy
    environment:
      LOG_LEVEL: debug

  # Service Admin
  service-admin:
    depends_on:
      identity:
        condition: service_healthy
    environment:
      NODE_ENV: development

  # Not present above because dev overrides nothing else about them; these
  # blocks exist purely to reopen host ports the base file no longer publishes.
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  models:
    ports:
      - "${MODELS_PORT:-5008}:5008"

  # The operator console. Private by default; a developer verifying the UI in a
  # browser needs it on the host, and browser verification is the only kind that
  # counts for anything user-facing.
  control-center:
    ports:
      - "${CONTROL_CENTER_PORT:-8000}:8000"
