name: pod-partition
description: >
  A network segment is lost and all 40 racks in pod 2 go silent at once.
  Not zero — ABSENT. The rollup over rack meters must emit `incomplete`,
  never a partial sum presented as a total.
faults:
  - kind: partition
    points: dc1.it.rack.p2*
    start_s: 34500
    end_s: 35400
expect:
  - id: rollup_incomplete
    assert: rack_rollup_emits_incomplete_not_partial_sum
    because: >
      compute.rollup has an `incomplete` port precisely for this. A partial
      sum rendered as a total is the same species of lie as the dead meter,
      and is harder to spot because the number moves plausibly.
  - id: no_pue_from_partial
    assert: pue_not_derived_from_partial_rack_sum
    because: >
      There must be no path from `incomplete` to a PUE number. Enforced by
      graph topology, not by a runtime check someone can forget.
