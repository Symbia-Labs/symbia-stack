# Symbia Stack
# Start: docker-compose up -d          View logs: docker-compose logs -f
#
# EXPOSURE: exactly one port reaches the host — 9000, the API front end.
#
# Every service still listens on its own port and every service still reaches
# every other one; they do it over the compose network by service name
# (IDENTITY_HOST: identity, and so on), which is why publishing 5001-5009 and
# 5432 to the host bought nothing but reach. A published port is a door, and a
# door nobody opens is still a door. Eleven of them were open by default.
#
# Developers who want the operator console on 8000, psql on 5432, or a service
# port to curl should use docker-compose.dev.yml, which adds them back:
#
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# start.sh does this for you via COMPOSE_FILE. That file is NOT named
# docker-compose.override.yml on purpose: compose loads an override file
# automatically, so anyone who cloned the repo would silently get the
# developer's exposure surface and the default above would be a fiction.
#
# Port Configuration:
# All ports can be customized via environment variables or .env file.
# Default ports: postgres=5432, identity=5001, logging=5002, catalog=5003,
# assistants=5004, messaging=5005, runtime=5006, integrations=5007,
# network=5009, control-center=8000, api=9000
#
# Ports are declared in @symbia/sys and restated here because compose cannot
# import it. `npm run check:ports` asserts the two agree.

services:
  # PostgreSQL database
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symbia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symbia_dev}
      POSTGRES_DB: ${POSTGRES_DB:-symbia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symbia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database bootstrap - creates per-service databases and tables
  db-bootstrap:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-symbia}
      PGPASSWORD: ${POSTGRES_PASSWORD:-symbia_dev}
    volumes:
      - ./:/workspace:ro
      - ./db-bootstrap/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/bootstrap.sh"]
    restart: "no"

  # Identity Service - Authentication & Authorization
  identity:
    restart: unless-stopped
    build:
      context: .
      dockerfile: identity/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env (openssl rand -hex 32)}
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/identity
      SESSION_SECRET: ${SESSION_SECRET:-symbia-dev-secret-change-in-production}
      # Credential vault key (HKDF-derived). Required in production by the vault;
      # a dev default keeps the local stack booting, same pattern as the secrets
      # above. Real deployments MUST override this.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-symbia-credential-dev-key-change-in-production}
      # Development switch. Untokened requests run as the first existing user.
      # OFF unless set: a gate skipped by default is not a gate.
      #
      # The control center's login-disabled build depends on this. Before
      # 6 Aug 2026 only the CLIENT half existed — App.tsx probed for it and
      # identity had no such setting — so the probe could never succeed and a
      # dev auto-login with hardcoded credentials was silently carrying the
      # whole console.
      DEV_NO_AUTH: ${DEV_NO_AUTH:-false}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_identity:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logging Service - Telemetry & Observability
  logging:
    restart: unless-stopped
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/logging
      IDENTITY_SERVICE_URL: http://identity:5001
    depends_on:
      identity:
        condition: service_healthy
      network:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_logging:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5002/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Catalog Service - Resource Registry
  catalog:
    restart: unless-stopped
    build:
      context: .
      dockerfile: catalog/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/catalog
      IDENTITY_SERVICE_URL: http://identity:5001
      LOGGING_SERVICE_URL: http://logging:5002
    depends_on:
      identity:
        condition: service_healthy
      network:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_catalog:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5003/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Messaging Service - Real-time Communication
  messaging:
    restart: unless-stopped
    build:
      context: .
      dockerfile: messaging/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5005
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/messaging
      IDENTITY_SERVICE_URL: http://identity:5001
      LOGGING_SERVICE_URL: http://logging:5002
      ASSISTANTS_SERVICE_URL: http://assistants:5004
    depends_on:
      identity:
        condition: service_healthy
      network:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_messaging:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5005/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Network Service - Service Mesh & Event Routing
  network:
    restart: unless-stopped
    build:
      context: .
      dockerfile: network/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5009
      IDENTITY_SERVICE_URL: http://identity:5001
      LOGGING_SERVICE_URL: http://logging:5002
      NETWORK_HASH_SECRET: ${NETWORK_HASH_SECRET:-symbia-network-dev-secret}
    depends_on:
      identity:
        condition: service_healthy
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_network:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5009/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Directory Service - Federation control plane (peer directory, foreign-node
  # table, admission). No database; peers journal to JSONL, foreign nodes are
  # TTL-leased in memory on purpose.
  directory:
    restart: unless-stopped
    build:
      context: .
      dockerfile: directory/Dockerfile
    environment:
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5010
      IDENTITY_SERVICE_URL: http://identity:5001
      LOGGING_SERVICE_URL: http://logging:5002
    depends_on:
      identity:
        condition: service_healthy
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_directory:/app/.identity
      # Peer journal (peers.jsonl). A peer declaration is a recorded decision;
      # measured 12 Aug 2026: a routine service restart emptied the in-memory
      # table mid-measurement and every federation forward failed closed.
      - directory_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5010/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Runtime Service - Graph Execution Engine
  runtime:
    restart: unless-stopped
    build:
      context: .
      dockerfile: runtime/Dockerfile
    environment:
      # Where the SDN relay connects. WITHOUT THIS the relay falls back to
      # localhost:5009, which inside a container is the container itself,
      # and observability events are silently never emitted.
      NETWORK_SERVICE_URL: http://network:5009
      NODE_ENV: production
      PORT: 5006
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/runtime
      IDENTITY_SERVICE_URL: http://identity:5001
      CATALOG_SERVICE_URL: http://catalog:5003
      LOGGING_SERVICE_URL: http://logging:5002
    depends_on:
      catalog:
        condition: service_healthy
      network:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_runtime:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5006/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Assistants Service - AI Orchestration
  assistants:
    restart: unless-stopped
    build:
      context: .
      dockerfile: assistants/Dockerfile
    environment:
      # Same secret as `network`, because provenance.ts seals with the same
      # construction and its docstring promises an envelope sealed here is
      # checkable by the same means as an event crossing the mesh. Until
      # 10 Aug 2026 this was unset, so assistants fell back to
      # 'symbia-network-dev-only' while network used
      # 'symbia-network-dev-secret' — different secrets, so that promise
      # was false and nothing ever noticed.
      NETWORK_HASH_SECRET: ${NETWORK_HASH_SECRET:-symbia-network-dev-secret}
      NODE_ENV: production
      PORT: 5004
      DATABASE_URL: postgresql://${POSTGRES_USER:-symbia}:${POSTGRES_PASSWORD:-symbia_dev}@postgres:5432/assistants
      IDENTITY_SERVICE_URL: http://identity:5001
      CATALOG_SERVICE_URL: http://catalog:5003
      LOGGING_SERVICE_URL: http://logging:5002
      INTEGRATIONS_SERVICE_URL: http://integrations:5007
      # Completions go through the broker, which knows what each model will
      # accept. LLM_VIA_MODELS=0 restores the direct integrations call.
      MODELS_SERVICE_URL: http://models:5008
      MESSAGING_SERVICE_URL: http://messaging:5005
      # Added 7 Aug 2026. Without these, service.call from a rule resolved
      # runtime and network to localhost INSIDE the assistants container and
      # failed with a bare "fetch failed" surfaced to the end user in chat.
      # resolveServiceUrl falls back to localhost, which is right outside
      # compose and wrong inside it.
      RUNTIME_SERVICE_URL: http://runtime:5006
      NETWORK_SERVICE_URL: http://network:5009
      MESSAGING_ENDPOINT: http://messaging:5005
      CATALOG_BASE_URL: http://catalog:5003
    depends_on:
      catalog:
        condition: service_healthy
      network:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_assistants:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5004/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Integrations Service - LLM Provider Gateway
  integrations:
    restart: unless-stopped
    build:
      context: .
      dockerfile: integrations/Dockerfile
    environment:
      NODE_ENV: production
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env (openssl rand -hex 32)}
      PORT: 5007
      IDENTITY_SERVICE_URL: http://identity:5001
      CATALOG_SERVICE_URL: http://catalog:5003
      LOGGING_SERVICE_URL: http://logging:5002
      ASSISTANTS_SERVICE_URL: http://assistants:5004
      MESSAGING_SERVICE_URL: http://messaging:5005
      RUNTIME_SERVICE_URL: http://runtime:5006
      NETWORK_SERVICE_URL: http://network:5009
      MODELS_SERVICE_URL: http://models:5008
      # Add API keys for LLM providers
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      identity:
        condition: service_healthy
      network:
        condition: service_healthy
    volumes:
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_integrations:/app/.identity
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5007/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Models Service - Local LLM Inference (node-llama-cpp)
  models:
    restart: unless-stopped
    build:
      context: .
      dockerfile: models/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5008
      MODELS_PATH: /data/models
      IDENTITY_SERVICE_URL: http://identity:5001
      CATALOG_SERVICE_URL: http://catalog:5003
      LOGGING_SERVICE_URL: http://logging:5002
      NETWORK_SERVICE_URL: http://network:5009
      # Models asks integrations what remote providers exist, and from stage 1
      # hands it calls to execute. Integrations keeps the credentials; this
      # service does not become a second vault.
      INTEGRATIONS_SERVICE_URL: http://integrations:5007
      MAX_LOADED_MODELS: ${MAX_LOADED_MODELS:-2}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-900000}
      DEFAULT_GPU_LAYERS: ${DEFAULT_GPU_LAYERS:-0}
      DEFAULT_THREADS: ${DEFAULT_THREADS:-4}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - models_data:/data/models
      # Service identity key. Without this a recreated container is a new
      # identity each time — measured 10 Aug 2026: force-recreate changed
      # directory from 7d9b4cf2... to d7366b1c...
      - identity_models:/app/.identity
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      network:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5008/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API front end / admin console - ServiceId.API
  # Was `service-admin` on 9000, registered nowhere (F1).
  service-admin:
    restart: unless-stopped
    build:
      context: .
      dockerfile: service-admin/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 9000
      # Where each service lives. Set explicitly rather than defaulted:
      # resolveServiceHost() falls back to localhost, which is correct outside
      # compose and wrong inside it. Two proxies previously disagreed about
      # this default; now neither guesses.
      IDENTITY_HOST: identity
      LOGGING_HOST: logging
      CATALOG_HOST: catalog
      ASSISTANTS_HOST: assistants
      MESSAGING_HOST: messaging
      RUNTIME_HOST: runtime
      INTEGRATIONS_HOST: integrations
      MODELS_HOST: models
      NETWORK_HOST: network
      CONTROL_CENTER_HOST: control-center
      # PostgreSQL connection for database browser
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-symbia}
      POSTGRES_USER: ${POSTGRES_USER:-symbia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symbia_dev}
    ports:
      - "${API_PORT:-9000}:9000"
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Control Center - the operator console, service #10.
  # Previously not started by anything: it ran only if a developer knew to run
  # a bundler by hand (F5).
  control-center:
    restart: unless-stopped
    build:
      context: .
      dockerfile: symbia-control-center/Dockerfile
    environment:
      NODE_ENV: production
      CONTROL_CENTER_PORT: 8000
      IDENTITY_HOST: identity
      LOGGING_HOST: logging
      CATALOG_HOST: catalog
      ASSISTANTS_HOST: assistants
      MESSAGING_HOST: messaging
      RUNTIME_HOST: runtime
      INTEGRATIONS_HOST: integrations
      MODELS_HOST: models
      NETWORK_HOST: network
      DIRECTORY_HOST: directory
      API_HOST: service-admin
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  models_data:
  directory_data:
  identity_identity:
  identity_logging:
  identity_catalog:
  identity_messaging:
  identity_network:
  identity_directory:
  identity_runtime:
  identity_assistants:
  identity_integrations:
  identity_models:

networks:
  default:
    name: symbia-network
